name: OIDC Debug — Temporary

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    name: Inspect GitHub OIDC claims
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC subject
        shell: bash
        env:
          OIDC_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          set -euo pipefail

          TOKEN="$(
            curl \
              --fail \
              --silent \
              --show-error \
              -H "Authorization: Bearer ${OIDC_REQUEST_TOKEN}" \
              "${OIDC_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value'
          )"

          TOKEN="${TOKEN}" python3 <<'PY'
          import base64
          import json
          import os

          token = os.environ["TOKEN"]
          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit("Invalid JWT format")

          payload = parts[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          for key in (
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "ref_type",
          ):
              print(f"{key}: {claims.get(key)}")
          PY
