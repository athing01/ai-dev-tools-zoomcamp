name: Deploy — Module 3 (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: M3 automatic deployment retired
    runs-on: ubuntu-latest

    steps:
      - name: Explain deployment lifecycle closure
        shell: bash
        run: |
          set -euo pipefail
          echo "Module 3 automatic production deployment was retired."
          echo "Module 3 CI remains active."
          echo "Shared AWS infrastructure is retained for Module 4."
          echo "This workflow does not access AWS or deploy applications."
