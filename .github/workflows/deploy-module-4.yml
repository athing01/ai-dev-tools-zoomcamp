name: Deploy — Module 4 DEV

on:
  workflow_run:
    workflows:
      - "CI — Module 4"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: module-4-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "060622563960"
  RELEASE_BUCKET: taskflow-releaseartifactbucket-ah8yzqh3idur

  M4_DEV_ROLE_ARN: arn:aws:iam::060622563960:role/taskflow-m4-dev-deploy

  M4_DEV_APP_HOST: dev-app.zctaskflow.athing.cc
  M4_DEV_API_HOST: dev-api.zctaskflow.athing.cc
  M4_DEV_DEPLOY_DIR: /opt/taskflow-m4-dev
  M4_DEV_SSM_PARAMETER_PREFIX: /taskflow/m4/dev
  M4_DEV_RELEASE_STATE_PREFIX: release-state/m4/dev
  M4_DEV_SSM_LOG_GROUP: /taskflow/m4/dev/ssm

jobs:
  deploy-dev:
    name: Deploy to M4 DEV
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: m4-dev

    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: ${RELEASE_SHA}" >&2
            exit 1
          fi

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"

          if [[ "${CHECKED_OUT_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "Checkout does not match workflow_run.head_sha." >&2
            echo "Expected: ${RELEASE_SHA}" >&2
            echo "Actual:   ${CHECKED_OUT_SHA}" >&2
            exit 1
          fi

          echo "Release SHA: ${RELEASE_SHA}"
          echo "Upstream workflow run: ${{ github.event.workflow_run.id }}"

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.M4_DEV_ROLE_ARN }}
          role-session-name: taskflow-m4-dev-${{ github.event.workflow_run.head_sha }}

      - name: Verify release manifest
        shell: bash
        env:
          RELEASE_MANIFEST_KEY: manifests/m4/${{ github.event.workflow_run.head_sha }}.json
        run: |
          set -euo pipefail

          aws s3 cp \
            "s3://${RELEASE_BUCKET}/${RELEASE_MANIFEST_KEY}" \
            release-manifest.json \
            --region "${AWS_REGION}"

          jq -e \
            --arg git_sha "${RELEASE_SHA}" \
            '
              .git_sha == $git_sha and
              .artifact_tag == ("sha-" + $git_sha) and
              (.backend_digest | test("^sha256:[0-9a-f]{64}$")) and
              (.frontend_digest | test("^sha256:[0-9a-f]{64}$"))
            ' \
            release-manifest.json \
            >/dev/null

          echo "Release manifest verified: ${RELEASE_MANIFEST_KEY}"

      - name: Create M4 runtime bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_FILE="${RUNNER_TEMP}/taskflow-m4-dev-${RELEASE_SHA}.tar.gz"
          BUNDLE_KEY="deploy/m4/${RELEASE_SHA}.tar.gz"

          tar -czf "${BUNDLE_FILE}" \
            -C "${GITHUB_WORKSPACE}/module-4/deploy/ec2" \
            deploy.sh \
            -C "${GITHUB_WORKSPACE}/module-4/deploy/caddy" \
            Caddyfile \
            -C "${GITHUB_WORKSPACE}/module-4/deploy/compose" \
            docker-compose.ec2.yml

          EXPECTED_FILES=$'Caddyfile\ndeploy.sh\ndocker-compose.ec2.yml'
          ACTUAL_FILES="$(tar -tzf "${BUNDLE_FILE}" | sort)"

          if [[ "${ACTUAL_FILES}" != "${EXPECTED_FILES}" ]]; then
            echo "Unexpected runtime bundle contents." >&2
            printf '%s\n' "${ACTUAL_FILES}" >&2
            exit 1
          fi

          aws s3 cp \
            "${BUNDLE_FILE}" \
            "s3://${RELEASE_BUCKET}/${BUNDLE_KEY}" \
            --region "${AWS_REGION}" \
            --content-type application/gzip

          echo "BUNDLE_KEY=${BUNDLE_KEY}" >> "${GITHUB_ENV}"
          echo "Bundle uploaded: s3://${RELEASE_BUCKET}/${BUNDLE_KEY}"

      - name: Deploy through SSM
        id: ssm
        shell: bash
        env:
          MANIFEST_KEY: manifests/m4/${{ github.event.workflow_run.head_sha }}.json
          BUNDLE_KEY: deploy/m4/${{ github.event.workflow_run.head_sha }}.tar.gz
        run: |
          set -euo pipefail

          BUNDLE_FILE="/tmp/taskflow-m4-dev-${RELEASE_SHA}.tar.gz"

          DEPLOY_COMMANDS="$(
            jq -n \
              --arg region "${AWS_REGION}" \
              --arg bundle_uri "s3://${RELEASE_BUCKET}/${BUNDLE_KEY}" \
              --arg bundle_file "${BUNDLE_FILE}" \
              --arg deploy_dir "${M4_DEV_DEPLOY_DIR}" \
              --arg release_bucket "${RELEASE_BUCKET}" \
              --arg manifest_key "${MANIFEST_KEY}" \
              --arg app_host "${M4_DEV_APP_HOST}" \
              --arg api_host "${M4_DEV_API_HOST}" \
              --arg ssm_prefix "${M4_DEV_SSM_PARAMETER_PREFIX}" \
              --arg release_state_prefix "${M4_DEV_RELEASE_STATE_PREFIX}" \
              '[
                "set -euo pipefail",
                ("mkdir -p " + $deploy_dir),
                ("aws s3 cp " + $bundle_uri + " " + $bundle_file + " --region " + $region),
                ("tar -xzf " + $bundle_file + " -C " + $deploy_dir + " --no-same-owner"),
                ("chmod 0755 " + $deploy_dir + "/deploy.sh"),
                ("rm -f " + $bundle_file),
                (
                  "exec env " +
                  "AWS_REGION=" + $region + " " +
                  "TASKFLOW_RELEASE_BUCKET=" + $release_bucket + " " +
                  "TASKFLOW_APP_HOST=" + $app_host + " " +
                  "TASKFLOW_API_HOST=" + $api_host + " " +
                  "TASKFLOW_SSM_PARAMETER_PREFIX=" + $ssm_prefix + " " +
                  "DEPLOY_DIR=" + $deploy_dir + " " +
                  "RELEASE_STATE_PREFIX=" + $release_state_prefix + " " +
                  $deploy_dir + "/deploy.sh " + $manifest_key
                )
              ]'
          )"

          jq -n \
            --argjson commands "${DEPLOY_COMMANDS}" \
            --arg log_group "${M4_DEV_SSM_LOG_GROUP}" \
            '{
              DocumentName: "AWS-RunShellScript",
              Targets: [
                {
                  Key: "tag:TaskFlowM4",
                  Values: ["true"]
                },
                {
                  Key: "tag:Environment",
                  Values: ["dev"]
                }
              ],
              Parameters: {
                commands: $commands
              },
              CloudWatchOutputConfig: {
                CloudWatchLogGroupName: $log_group,
                CloudWatchOutputEnabled: true
              },
              MaxConcurrency: "1",
              MaxErrors: "0",
              TimeoutSeconds: 3600
            }' > "${RUNNER_TEMP}/ssm-send-command.json"

          COMMAND_ID="$(
            aws ssm send-command \
              --cli-input-json "file://${RUNNER_TEMP}/ssm-send-command.json" \
              --region "${AWS_REGION}" \
              --query 'Command.CommandId' \
              --output text
          )"

          if [[ -z "${COMMAND_ID}" || "${COMMAND_ID}" == "None" ]]; then
            echo "SSM Run Command did not return a command ID." >&2
            exit 1
          fi

          echo "command_id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"
          echo "SSM command ID: ${COMMAND_ID}"

          for attempt in $(seq 1 360); do
            INVOCATIONS="$(
              aws ssm list-command-invocations \
                --command-id "${COMMAND_ID}" \
                --details \
                --region "${AWS_REGION}" \
                --query 'CommandInvocations' \
                --output json
            )"

            COUNT="$(jq 'length' <<< "${INVOCATIONS}")"

            if [[ "${COUNT}" -eq 0 ]]; then
              sleep 10
              continue
            fi

            if [[ "${COUNT}" -ne 1 ]]; then
              echo "Expected exactly one M4 DEV invocation, got ${COUNT}." >&2
              echo "${INVOCATIONS}" >&2
              exit 1
            fi

            STATUS="$(jq -r '.[0].Status' <<< "${INVOCATIONS}")"
            INSTANCE_ID="$(jq -r '.[0].InstanceId' <<< "${INVOCATIONS}")"

            case "${STATUS}" in
              Success)
                echo "SSM deployment succeeded on ${INSTANCE_ID}."
                echo "instance_id=${INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
                break
                ;;

              Pending|InProgress|Delayed)
                echo "SSM status: ${STATUS} (${attempt}/360)"
                sleep 10
                ;;

              *)
                echo "SSM deployment failed with status: ${STATUS}" >&2
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --region "${AWS_REGION}" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json \
                  >&2 || true
                exit 1
                ;;
            esac

            if [[ "${attempt}" -eq 360 ]]; then
              echo "Timed out waiting for SSM command ${COMMAND_ID}." >&2
              exit 1
            fi
          done

      - name: Verify DEV release state
        shell: bash
        env:
          MANIFEST_KEY: manifests/m4/${{ github.event.workflow_run.head_sha }}.json
        run: |
          set -euo pipefail

          BACKEND_IMAGE="$(
            jq -r '.backend_image' release-manifest.json
          )"
          BACKEND_DIGEST="$(
            jq -r '.backend_digest' release-manifest.json
          )"
          FRONTEND_IMAGE="$(
            jq -r '.frontend_image' release-manifest.json
          )"
          FRONTEND_DIGEST="$(
            jq -r '.frontend_digest' release-manifest.json
          )"

          EXPECTED_BACKEND_IMAGE="${BACKEND_IMAGE}@${BACKEND_DIGEST}"
          EXPECTED_FRONTEND_IMAGE="${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

          RELEASE_STATE_KEY="${M4_DEV_RELEASE_STATE_PREFIX}/${RELEASE_SHA}.json"

          aws s3 cp \
            "s3://${RELEASE_BUCKET}/${RELEASE_STATE_KEY}" \
            release-state.json \
            --region "${AWS_REGION}"

          jq -e \
            --arg git_sha "${RELEASE_SHA}" \
            --arg backend_image "${EXPECTED_BACKEND_IMAGE}" \
            --arg frontend_image "${EXPECTED_FRONTEND_IMAGE}" \
            '
              .git_sha == $git_sha and
              .backend_image == $backend_image and
              .frontend_image == $frontend_image
            ' \
            release-state.json \
            >/dev/null

          echo "DEV release-state matches the requested release SHA and exact image digests."

      - name: Smoke test DEV frontend
        shell: bash
        run: |
          set -euo pipefail

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://${M4_DEV_APP_HOST}/"
          )"

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "DEV frontend smoke test expected HTTP 200, got ${HTTP_STATUS}." >&2
            exit 1
          fi

      - name: Smoke test DEV tasks API
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE_FILE="${RUNNER_TEMP}/dev-api-tasks.json"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --output "${RESPONSE_FILE}" \
              --write-out '%{http_code}' \
              "https://${M4_DEV_API_HOST}/api/tasks"
          )"

          if [[ "${HTTP_STATUS}" != "200" ]]; then
            echo "DEV API smoke test expected HTTP 200, got ${HTTP_STATUS}." >&2
            cat "${RESPONSE_FILE}" >&2
            exit 1
          fi

          jq -e 'type == "array"' "${RESPONSE_FILE}" >/dev/null

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## M4 DEV deployment"
            echo
            echo "- Release SHA: \`${RELEASE_SHA}\`"
            echo "- Manifest: \`manifests/m4/${RELEASE_SHA}.json\`"
            echo "- Bundle: \`deploy/m4/${RELEASE_SHA}.tar.gz\`"
            echo "- Environment: \`m4-dev\`"
            echo "- Instance: \`${{ steps.ssm.outputs.instance_id }}\`"
            echo "- SSM command: \`${{ steps.ssm.outputs.command_id }}\`"
            echo "- Status: deployed and smoke-tested"
          } >> "${GITHUB_STEP_SUMMARY}"
