name: Promote — Module 4 PROD

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Existing M4 release SHA to promote from DEV"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: module-4-prod-promotion
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  RELEASE_BUCKET: taskflow-releaseartifactbucket-ah8yzqh3idur
  M4_PROD_ROLE_ARN: arn:aws:iam::060622563960:role/taskflow-m4-prod-promote
  M4_PROD_INSTANCE_ID: i-0ce1c68ad9c9d6f28
  M4_PROD_APP_HOST: app.zctaskflow.athing.cc
  M4_PROD_API_HOST: api.zctaskflow.athing.cc
  M4_PROD_DEPLOY_DIR: /opt/taskflow
  M4_PROD_SSM_PARAMETER_PREFIX: /taskflow/m4/prod
  M4_PROD_RELEASE_STATE_PREFIX: release-state/m4/prod
  M4_PROD_SSM_LOG_GROUP: /taskflow/m4/prod/ssm

jobs:
  promote:
    name: Promote existing release to M4 PROD
    runs-on: ubuntu-latest
    environment: m4-prod

    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_SHA: ${{ inputs.release_sha }}

    steps:
      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: ${RELEASE_SHA}" >&2
            exit 1
          fi

          echo "Release SHA: ${RELEASE_SHA}"

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.M4_PROD_ROLE_ARN }}
          role-session-name: taskflow-m4-prod-${{ inputs.release_sha }}

      - name: Verify DEV release artifact
        shell: bash
        env:
          MANIFEST_KEY: manifests/m4/${{ inputs.release_sha }}.json
          DEV_STATE_KEY: release-state/m4/dev/${{ inputs.release_sha }}.json
          BUNDLE_KEY: deploy/m4/${{ inputs.release_sha }}.tar.gz
        run: |
          set -euo pipefail

          aws s3 cp \
            "s3://${RELEASE_BUCKET}/${MANIFEST_KEY}" \
            release-manifest.json \
            --region "${AWS_REGION}"

          aws s3 cp \
            "s3://${RELEASE_BUCKET}/${DEV_STATE_KEY}" \
            dev-release-state.json \
            --region "${AWS_REGION}"

          aws s3api head-object \
            --bucket "${RELEASE_BUCKET}" \
            --key "${BUNDLE_KEY}" \
            --region "${AWS_REGION}" \
            >/dev/null

          jq -e \
            --arg git_sha "${RELEASE_SHA}" \
            '
              .git_sha == $git_sha and
              .artifact_tag == ("sha-" + $git_sha) and
              (.backend_digest | test("^sha256:[0-9a-f]{64}$")) and
              (.frontend_digest | test("^sha256:[0-9a-f]{64}$"))
            ' \
            release-manifest.json \
            >/dev/null

          BACKEND_IMAGE="$(jq -r '.backend_image' release-manifest.json)"
          BACKEND_DIGEST="$(jq -r '.backend_digest' release-manifest.json)"
          FRONTEND_IMAGE="$(jq -r '.frontend_image' release-manifest.json)"
          FRONTEND_DIGEST="$(jq -r '.frontend_digest' release-manifest.json)"

          EXPECTED_BACKEND_IMAGE="${BACKEND_IMAGE}@${BACKEND_DIGEST}"
          EXPECTED_FRONTEND_IMAGE="${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

          jq -e \
            --arg git_sha "${RELEASE_SHA}" \
            --arg backend_image "${EXPECTED_BACKEND_IMAGE}" \
            --arg frontend_image "${EXPECTED_FRONTEND_IMAGE}" \
            '
              .git_sha == $git_sha and
              .backend_image == $backend_image and
              .frontend_image == $frontend_image
            ' \
            dev-release-state.json \
            >/dev/null

          echo "DEV artifact verified."
          echo "Manifest: ${MANIFEST_KEY}"
          echo "Bundle:   ${BUNDLE_KEY}"
          echo "DEV state: ${DEV_STATE_KEY}"

      - name: Promote through SSM
        id: ssm
        shell: bash
        env:
          MANIFEST_KEY: manifests/m4/${{ inputs.release_sha }}.json
          BUNDLE_KEY: deploy/m4/${{ inputs.release_sha }}.tar.gz
        run: |
          set -euo pipefail

          BUNDLE_FILE="/tmp/taskflow-m4-prod-${RELEASE_SHA}.tar.gz"

          DEPLOY_COMMANDS="$(
            jq -n \
              --arg region "${AWS_REGION}" \
              --arg bundle_uri "s3://${RELEASE_BUCKET}/${BUNDLE_KEY}" \
              --arg bundle_file "${BUNDLE_FILE}" \
              --arg deploy_dir "${M4_PROD_DEPLOY_DIR}" \
              --arg release_bucket "${RELEASE_BUCKET}" \
              --arg manifest_key "${MANIFEST_KEY}" \
              --arg app_host "${M4_PROD_APP_HOST}" \
              --arg api_host "${M4_PROD_API_HOST}" \
              --arg ssm_prefix "${M4_PROD_SSM_PARAMETER_PREFIX}" \
              --arg release_state_prefix "${M4_PROD_RELEASE_STATE_PREFIX}" \
              '[
                "set -euo pipefail",
                ("mkdir -p " + $deploy_dir),
                ("aws s3 cp " + $bundle_uri + " " + $bundle_file + " --region " + $region),
                ("tar -xzf " + $bundle_file + " -C " + $deploy_dir + " --no-same-owner"),
                ("chmod 0755 " + $deploy_dir + "/deploy.sh"),
                ("rm -f " + $bundle_file),
                (
                  "exec env " +
                  "AWS_REGION=" + $region + " " +
                  "TASKFLOW_RELEASE_BUCKET=" + $release_bucket + " " +
                  "TASKFLOW_APP_HOST=" + $app_host + " " +
                  "TASKFLOW_API_HOST=" + $api_host + " " +
                  "TASKFLOW_SSM_PARAMETER_PREFIX=" + $ssm_prefix + " " +
                  "DEPLOY_DIR=" + $deploy_dir + " " +
                  "RELEASE_STATE_PREFIX=" + $release_state_prefix + " " +
                  $deploy_dir + "/deploy.sh " + $manifest_key
                )
              ]'
          )"

          jq -n \
            --argjson commands "${DEPLOY_COMMANDS}" \
            --arg instance_id "${M4_PROD_INSTANCE_ID}" \
            --arg log_group "${M4_PROD_SSM_LOG_GROUP}" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance_id],
              Parameters: {
                commands: $commands
              },
              CloudWatchOutputConfig: {
                CloudWatchLogGroupName: $log_group,
                CloudWatchOutputEnabled: true
              },
              MaxConcurrency: "1",
              MaxErrors: "0",
              TimeoutSeconds: 3600
            }' > "${RUNNER_TEMP}/ssm-send-command.json"

          COMMAND_ID="$(
            aws ssm send-command \
              --cli-input-json "file://${RUNNER_TEMP}/ssm-send-command.json" \
              --region "${AWS_REGION}" \
              --query 'Command.CommandId' \
              --output text
          )"

          if [[ -z "${COMMAND_ID}" || "${COMMAND_ID}" == "None" ]]; then
            echo "SSM Run Command did not return a command ID." >&2
            exit 1
          fi

          echo "command_id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"
          echo "SSM command ID: ${COMMAND_ID}"

          for attempt in $(seq 1 360); do
            INVOCATIONS="$(
              aws ssm list-command-invocations \
                --command-id "${COMMAND_ID}" \
                --details \
                --region "${AWS_REGION}" \
                --query 'CommandInvocations' \
                --output json
            )"

            COUNT="$(jq 'length' <<< "${INVOCATIONS}")"

            if [[ "${COUNT}" -eq 0 ]]; then
              sleep 10
              continue
            fi

            if [[ "${COUNT}" -ne 1 ]]; then
              echo "Expected exactly one PROD invocation, got ${COUNT}." >&2
              echo "${INVOCATIONS}" >&2
              exit 1
            fi

            STATUS="$(jq -r '.[0].Status' <<< "${INVOCATIONS}")"

            case "${STATUS}" in
              Success)
                echo "PROD promotion succeeded."
                break
                ;;
              Pending|InProgress|Delayed)
                echo "SSM status: ${STATUS} (${attempt}/360)"
                sleep 10
                ;;
              *)
                echo "PROD promotion failed with status: ${STATUS}" >&2
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${M4_PROD_INSTANCE_ID}" \
                  --region "${AWS_REGION}" \
                  --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json \
                  >&2 || true
                exit 1
                ;;
            esac

            if [[ "${attempt}" -eq 360 ]]; then
              echo "Timed out waiting for SSM command ${COMMAND_ID}." >&2
              exit 1
            fi
          done

      - name: Verify PROD release state
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_IMAGE="$(jq -r '.backend_image' release-manifest.json)"
          BACKEND_DIGEST="$(jq -r '.backend_digest' release-manifest.json)"
          FRONTEND_IMAGE="$(jq -r '.frontend_image' release-manifest.json)"
          FRONTEND_DIGEST="$(jq -r '.frontend_digest' release-manifest.json)"

          EXPECTED_BACKEND_IMAGE="${BACKEND_IMAGE}@${BACKEND_DIGEST}"
          EXPECTED_FRONTEND_IMAGE="${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"

          RELEASE_STATE_KEY="${M4_PROD_RELEASE_STATE_PREFIX}/${RELEASE_SHA}.json"

          aws s3 cp \
            "s3://${RELEASE_BUCKET}/${RELEASE_STATE_KEY}" \
            prod-release-state.json \
            --region "${AWS_REGION}"

          jq -e \
            --arg git_sha "${RELEASE_SHA}" \
            --arg backend_image "${EXPECTED_BACKEND_IMAGE}" \
            --arg frontend_image "${EXPECTED_FRONTEND_IMAGE}" \
            '
              .git_sha == $git_sha and
              .backend_image == $backend_image and
              .frontend_image == $frontend_image
            ' \
            prod-release-state.json \
            >/dev/null

      - name: Smoke test PROD frontend
        shell: bash
        run: |
          set -euo pipefail

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://${M4_PROD_APP_HOST}/"
          )"

          [[ "${HTTP_STATUS}" == "200" ]]

      - name: Smoke test PROD tasks API
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE_FILE="${RUNNER_TEMP}/prod-api-tasks.json"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --output "${RESPONSE_FILE}" \
              --write-out '%{http_code}' \
              "https://${M4_PROD_API_HOST}/api/tasks"
          )"

          [[ "${HTTP_STATUS}" == "200" ]]
          jq -e 'type == "array"' "${RESPONSE_FILE}" >/dev/null

      - name: Publish promotion summary
        shell: bash
        run: |
          {
            echo "## M4 PROD promotion"
            echo
            echo "- Release SHA: \`${RELEASE_SHA}\`"
            echo "- Manifest: \`manifests/m4/${RELEASE_SHA}.json\`"
            echo "- Bundle: \`deploy/m4/${RELEASE_SHA}.tar.gz\`"
            echo "- Source environment: \`m4-dev\`"
            echo "- Target environment: \`m4-prod\`"
            echo "- Target instance: \`${M4_PROD_INSTANCE_ID}\`"
            echo "- Promotion actor: \`${GITHUB_ACTOR}\`"
            echo "- SSM command: \`${{ steps.ssm.outputs.command_id }}\`"
            echo "- Status: promoted and smoke-tested"
          } >> "${GITHUB_STEP_SUMMARY}"
