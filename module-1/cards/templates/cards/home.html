<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>e-Business Card Generator</title>
</head>
<body>
  <h1>e-Business Card Generator</h1>

  {% if submission_valid %}
    <p>Card information is valid. Image generation will be added later.</p>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <div>
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit">Validate card information</button>
  </form>
</body>
</html>
