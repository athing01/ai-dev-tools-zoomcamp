receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

  otlphttp/lgtm:
    endpoint: http://lgtm:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/lgtm]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/lgtm]
