services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      TASKFLOW_APP_HOST: ${TASKFLOW_APP_HOST:?TASKFLOW_APP_HOST is required}
      TASKFLOW_API_HOST: ${TASKFLOW_API_HOST:?TASKFLOW_API_HOST is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - taskflow

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      TASKFLOW_OBSERVABILITY_ENABLED: ${TASKFLOW_OBSERVABILITY_ENABLED:?TASKFLOW_OBSERVABILITY_ENABLED is required}
      TASKFLOW_ENVIRONMENT: ${TASKFLOW_ENVIRONMENT:?TASKFLOW_ENVIRONMENT is required}
      TASKFLOW_RELEASE_SHA: ${TASKFLOW_RELEASE_SHA:?TASKFLOW_RELEASE_SHA is required}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-taskflow-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-30000}
      OTEL_BLRP_SCHEDULE_DELAY: ${OTEL_BLRP_SCHEDULE_DELAY:-10000}
      TASKFLOW_P4_FAULT_MODE: ${TASKFLOW_P4_FAULT_MODE:-off}
    expose:
      - "8000"
    networks:
      - taskflow

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - taskflow

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command:
      - /app/.venv/bin/alembic
      - upgrade
      - head
    networks:
      - taskflow

volumes:
  caddy_data:
  caddy_config:

networks:
  taskflow:
