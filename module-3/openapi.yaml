openapi: 3.0.3
info:
  title: TaskFlow API
  description: REST API for the TaskFlow personal Kanban board.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Tasks
    description: Task management operations

paths:
  /api/tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      operationId: listTasks
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    post:
      tags:
        - Tasks
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        description: Unique integer identifier of the task
        schema:
          type: integer
          format: int64
          minimum: 1

    patch:
      tags:
        - Tasks
      summary: Partially update a task
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Tasks
      summary: Delete a task
      operationId: deleteTask
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    TaskStatus:
      type: string
      enum:
        - todo
        - in_progress
        - done
      description: Current task status.

    Task:
      type: object
      required:
        - id
        - title
        - description
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier generated by the backend.
        title:
          type: string
          description: Task title, trimmed before storage and requiring at least one non-whitespace character.
        description:
          type: string
          description: Optional task description. Returned as an empty string when not provided.
        status:
          $ref: '#/components/schemas/TaskStatus'
        created_at:
          type: string
          format: date-time
          description: Timestamp assigned when the task is created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp updated whenever the task changes.

    CreateTaskRequest:
      type: object
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Required task title. Must contain at least one non-whitespace character; the backend trims it before storage.
        description:
          type: string
          description: Optional task description.
        status:
          $ref: '#/components/schemas/TaskStatus'
          default: todo

    UpdateTaskRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Optional replacement title. Must contain at least one non-whitespace character; the backend trims it before storage.
        description:
          type: string
          description: Optional replacement task description.
        status:
          $ref: '#/components/schemas/TaskStatus'

    ErrorResponse:
      type: object
      required:
        - message
      additionalProperties: false
      properties:
        message:
          type: string
          description: Human-readable error message.
